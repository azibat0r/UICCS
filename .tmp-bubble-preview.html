<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    background: #1c1c1e;
    padding: 40px;
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 420px;
  }
  .row { display: flex; flex-direction: column; }
  .row.mine { align-items: flex-end; }
  .row.theirs { align-items: flex-start; }
  .meta { font-size: 11px; color: #9a9a9e; margin-bottom: 4px; }
  .bubble {
    position: relative;
    margin-top: 4px;
    border-radius: 18px;
    padding: 8px 16px;
    font-size: 14px;
    max-width: 80%;
    color: white;
  }
  .bubble.mine {
    background: #0A84FF;
  }
  .bubble.mine::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: -6px;
    width: 10px;
    height: 10px;
    background: #0A84FF;
    clip-path: polygon(0 0, 100% 100%, 0 100%);
  }
  .bubble.theirs {
    background: #3A3A3C;
  }
  .bubble.theirs::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: -6px;
    width: 10px;
    height: 10px;
    background: #3A3A3C;
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
  }
</style>
</head>
<body>
  <div class="row theirs">
    <div class="meta">Jordan · Aug 31, 2:14 PM</div>
    <div class="bubble theirs">Solved: Two Sum</div>
  </div>
  <div class="row mine">
    <div class="meta">Aug 31, 2:16 PM</div>
    <div class="bubble mine">Solved: Longest Substring Without Repeating Characters</div>
  </div>
  <div class="row theirs">
    <div class="meta">Jordan · Aug 31, 2:20 PM</div>
    <div class="bubble theirs">Solved: Merge Intervals</div>
  </div>
</body>
</html>
